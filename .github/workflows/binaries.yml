name: Binaries

# Prebuilt `claude-commander` + `claude-commander-server` for every commit on
# main that passes CI, published as a rolling `main-build` prerelease. Tagged
# releases still ship source only (publish-tap.yml / publish-aur.yml).
#
# Triggered by CI *completing* rather than by the push, so a commit that breaks
# CI is never published. None of CI's own builds can be shipped instead: the Nix
# build is linked against /nix/store, the rest are debug, and nothing builds
# aarch64 Linux. A `workflow_run` trigger always uses this file as it is on the
# default branch, so changes to the trigger take effect only once merged.
#
# A pull request that edits this file runs the build matrix (never the publish
# job), so a change to the build is exercised before it reaches main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/binaries.yml

# A newer green main commit supersedes an in-flight main build: only the latest one
# is ever published, so there is nothing worth finishing.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

# Same backstop as ci.yml. Nothing here runs the app beyond `--version`, but the
# baked telemetry credential is compiled into these binaries all the same.
env:
  DO_NOT_TRACK: "1"
  # The commit being built. Under `workflow_run`, GITHUB_SHA is the default
  # branch's tip when the event fired, not the commit CI just passed; under
  # `pull_request` it is a synthetic merge commit.
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    # `branches: [main]` above filters on the head branch *name*, which a pull
    # request from a fork's own `main` also matches, so additionally require a
    # successful push run in this repository.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04, not the older-glibc 22.04: libspa-sys 0.10 (cpal's PipeWire
          # backend) binds against PipeWire headers newer than 22.04's 0.3.48,
          # which lack `spa_video_info_raw.flags`, `spa_meta_first` and
          # `spa_meta_region_is_valid` — the build fails there (run 40089122857).
          # So the floor is 24.04's glibc 2.39: a binary runs on any glibc at
          # least as new as the one it was linked against.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      # Plain rustup, not the Nix dev shell the CI jobs use: a binary built
      # against the Nix store carries a /nix/store ELF interpreter and RPATHs,
      # and would not start on an ordinary distro.
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The apt equivalents of flake.nix's package inputs: core's default
      # `audio` feature links ALSA and libpipewire (cpal/rodio), and the
      # pipewire-sys/libspa-sys build scripts run bindgen, which needs libclang.
      # macOS needs nothing — CoreAudio ships in the SDK.
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libpipewire-0.3-dev libclang-dev clang

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: binaries-${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_run' }}

      # The real `[profile.release]` (fat LTO, strip), so a main build is exactly
      # what a release build would be. Nobody waits on a post-merge run.
      - name: Build
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          -p claude-commander -p claude-commander-server

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="claude-commander-main-${BUILD_SHA::7}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/claude-commander" \
             "target/${{ matrix.target }}/release/claude-commander-server" \
             README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # `shasum` exists on both runner OSes; sha256sum is not on macOS.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "dir=dist/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Runs the packaged copies, so a shared library missing on the runner
      # fails here at load time rather than on a user's machine.
      - name: Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.package.outputs.dir }}/claude-commander" --version
          "${{ steps.package.outputs.dir }}/claude-commander-server" --version

      - name: Upload Archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  main-build:
    name: Publish Main Build
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Delete and recreate rather than moving the `main-build` tag in place: the
      # release and its tag are replaced together, and nothing is force-pushed.
      # `--prerelease` keeps it off "latest", so releases/latest — and with it
      # the Homebrew and AUR flows — still resolve to the last tagged release.
      #
      # CI runs for successive commits can finish out of order, and
      # cancel-in-progress only cancels a run that is still going. So before
      # replacing anything, skip if the current main build is already a newer
      # commit than this one.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if current=$(gh api "repos/$GH_REPO/commits/main-build" --jq .sha 2>/dev/null); then
            status=$(gh api "repos/$GH_REPO/compare/${BUILD_SHA}...${current}" --jq .status)
            if [ "$status" = "ahead" ]; then
              echo "main-build is already at ${current}, newer than ${BUILD_SHA}; not replacing it"
              exit 0
            fi
          fi
          short="${BUILD_SHA::7}"
          cat > notes.md <<EOF
          Automated build of [\`${short}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${BUILD_SHA}) on \`main\`. Not a release — expect rough edges.

          Each archive holds \`claude-commander\` (the TUI/CLI) and \`claude-commander-server\` (headless server + web UI).

          **Runtime requirements**
          - \`tmux\` and \`git\` on \`PATH\`.
          - Linux: \`claude-commander\` links \`libasound.so.2\` and \`libpipewire-0.3.so.0\` (ALSA and PipeWire, present on desktop distros). \`claude-commander-server\` has no audio dependencies. Needs glibc 2.39 or newer (Ubuntu 24.04, Debian 13, Fedora 40 and later).
          - macOS: the binaries are unsigned; clear the quarantine flag with \`xattr -d com.apple.quarantine claude-commander claude-commander-server\`.
          EOF
          gh release delete main-build --cleanup-tag --yes || true
          gh release create main-build \
            --prerelease \
            --target "$BUILD_SHA" \
            --title "Main build (${short})" \
            --notes-file notes.md \
            dist/*
