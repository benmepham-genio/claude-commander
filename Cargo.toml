[workspace]
resolver = "2"
members = ["crates/*"]
# The Flutter client's Rust cdylib lives at `client/rust/` and is built by
# cargokit/flutter_rust_bridge with its own lockfile + mobile cross-compile
# targets. Exclude it from the core workspace so `cargo build` for the
# TUI/CLI/server never pulls in its (reqwest/tungstenite/android) dep tree.
exclude = ["client"]
# Plain `cargo build`/`cargo test` build the core lib, the TUI/CLI binary and the
# remote client. The server crate is not listed, but IS built anyway: the
# `claude-commander` binary depends on its library so `--serve` /
# `[server] auto_start` can run the HTTP API in the TUI's own process, which is
# the common single-machine setup. (Before that, the exclusion kept axum/tower
# out of a TUI-only build; there is no longer a TUI-only build to keep them out
# of.) Listing it here as well would only add its *binary* and integration tests
# to the default set.
default-members = [
    "crates/claude-commander-core",
    "crates/claude-commander-viewmodel",
    "crates/claude-commander-tui",
    "crates/claude-commander",
    "crates/claude-commander-remote",
    "crates/claude-commander-client",
]

[workspace.package]
version = "0.39.0"
edition = "2024"
authors = ["Claude Commander Contributors"]
license = "MIT"
repository = "https://github.com/claude-commander/claude-commander"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
